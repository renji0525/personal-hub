<!DOCTYPE html>
<html lang="ja" data-auth-pending>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="resource/icon/favicon.png">
    <title>YouTube RSS Reader</title>
    <style>html[data-auth-pending] body { display: none !important; }</style>
    <script src="../shared/js/auth.js"></script>
    <script>HubAuth.ready = HubAuth.protect();</script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="dark">

<aside>
    <div class="brand"><span class="brand-mark" aria-hidden="true">▶</span><div>y-rss<span>YOUR VIDEO LIBRARY</span></div></div>
    <div class="sidebar-top">
        <div class="section-title">登録チャンネル</div>
        <div id="channel-list"></div>
    </div>
    <div class="sidebar-bottom">
        <a class="btn-utility" href="../top/index.html">トップへ戻る</a>
        <button class="btn-utility" onclick="document.getElementById('settingsDialog').showModal()">⚙️ 設定</button>
    </div>
</aside>

<dialog id="settingsDialog" aria-labelledby="settingsTitle">
    <div class="settings-heading">
        <h2 id="settingsTitle">設定</h2>
        <form method="dialog"><button class="btn-utility" aria-label="設定を閉じる" autofocus>✕ 閉じる</button></form>
    </div>
    <div class="settings-content">
        <section class="account-settings" aria-label="アカウント操作">
            <button id="logoutButton" class="btn-utility" onclick="signOut()">ログアウト</button>
        </section>
        <div class="settings-actions">
        <button class="btn-utility" onclick="exportJSON()">📊 バックアップ(JSON)</button>
        <button class="btn-utility" onclick="document.getElementById('importFile').click()">📂 データを復元</button>
        <input type="file" id="importFile" style="display:none" accept=".json" onchange="importJSON(event)">
        <small id="importStatus" role="status" aria-live="polite"></small>
        <button class="btn-utility" onclick="toggleTheme()">🌓 ダークモード切替</button>
        <button class="btn-danger" onclick="resetAll()">🗑️ ストレージ破棄</button>
        </div>
    </div>
</dialog>

<main>
    <header>
        <div class="channel-add">
        <input type="text" id="channelIdInput" class="input-bar" placeholder="YouTube Channel ID (例: UC...)" aria-label="追加するチャンネルID">
        <button class="btn-add" onclick="addNewChannel()">追加</button>
        </div>
        <div class="video-actions">
        <button id="refreshButton" class="btn-utility" onclick="refreshAll()">🔄 更新</button>
        <button id="syncButton" class="btn-utility" onclick="manualSync()" title="既読状態とスプレッドシートの情報を同期">同期</button>
        <label class="unread-filter"><input type="checkbox" id="unreadOnlyInput" onchange="setUnreadOnly(this.checked)"> 未読のみ表示</label>
        </div>
    </header>
    <div class="activity-area">
        <small id="syncStatus" role="status" aria-live="polite"></small>
        <div id="refreshProgress" hidden>
            <div id="refreshProgressText" role="status" aria-live="polite"></div>
            <progress id="refreshProgressBar" value="0" max="1" aria-label="全チャンネルの更新進捗"></progress>
        </div>
    </div>
    <div id="video-container"></div>
</main>

<script src="js/main.js"></script>
<script src="js/accounts.js"></script>
</body>
</html>
