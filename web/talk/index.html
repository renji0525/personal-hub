<!DOCTYPE html>
<html lang="ja" data-auth-pending>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>トーク | Personal Hub</title><meta name="theme-color" content="#141e27">
<link rel="icon" href="../shared/icons/talk.svg" type="image/svg+xml">
<link rel="stylesheet" href="../shared/css/base.css"><link rel="stylesheet" href="../shared/css/navigation.css"><link rel="stylesheet" href="../shared/css/budget-spaces.css"><link rel="stylesheet" href="css/style.css">
<script src="../shared/js/auth.js"></script><script>HubAuth.ready=HubAuth.protect({local:true});</script>
<script src="../shared/js/budget-spaces.js" defer></script><script src="js/model.js" defer></script><script src="js/app.js" defer></script><script src="../shared/js/navigation.js" defer></script>
</head><body><a class="skip-link" href="#main">本文へ移動</a>
<header class="hub-header">
        <a class="hub-brand back-link" href="../top/index.html" aria-label="トップへ戻る"><img src="../shared/icons/hub.svg" width="32" height="32" alt=""><span>Personal Hub</span></a>
        <nav class="hub-nav" aria-label="ページ移動">
            <a href="../top/index.html"><img src="../shared/icons/hub.svg" width="22" height="22" alt=""><span>ホーム</span></a>
            <a href="../youtube-rss/index.html"><img src="../shared/icons/youtube.svg" width="22" height="22" alt=""><span>YouTube RSS</span></a>
            <a href="../budget/index.html"><img src="../shared/icons/budget.svg" width="22" height="22" alt=""><span>家計簿</span></a>
            <a href="../inventory/index.html"><img src="../shared/icons/inventory.svg" width="22" height="22" alt=""><span>在庫管理</span></a>
            <a href="../lists/index.html"><img src="../shared/icons/lists.svg" width="22" height="22" alt=""><span>リスト</span></a>
            <a href="../notes/index.html"><img src="../shared/icons/notes.svg" width="22" height="22" alt=""><span>メモ</span></a>
            <a href="../talk/index.html" aria-current="page"><img src="../shared/icons/talk.svg" width="22" height="22" alt=""><span>トーク</span></a>
        </nav>
        <div class="hub-account"><span id="currentUser" data-hub-user></span><button id="logoutButton" class="quiet" type="button"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5H5v14h4m5-11 4 4-4 4m-5-4h10"/></svg><span>ログアウト</span></button></div>
    </header>
<main id="main" class="workspace">
<div id="budgetSpaceBar" class="budget-space-bar" aria-label="共有スペースの選択">
    <strong id="budgetSpaceName">個人用</strong><button id="budgetSpaceSettings" type="button" class="quiet">共有の設定</button><button id="budgetSpacePersonal" type="button" class="quiet">個人用に戻る</button>
    <p id="budgetSpaceNotice" class="muted" role="status">未同期の変更は元のスペースに残ります。</p>
</div>
<div class="page-heading"><h1><img class="heading-icon" src="../shared/icons/talk.svg" width="42" height="42" alt="">トーク</h1><div class="page-actions"><button id="syncButton" class="quiet" disabled>同期する</button><button id="reloadButton" class="quiet" hidden>画面を開き直す</button></div></div>
<p id="status" class="sync-status" role="status" aria-live="polite">読み込み中…</p>
<p class="muted">未読・既読はこの端末の自分用です。相手には送信されません。</p>
<section class="conversation panel-surface" aria-label="メッセージ">
<button id="moreButton" class="quiet" hidden>以前の100件を表示</button>
<div id="messages" role="list" aria-label="トーク履歴"></div>
<button id="latestButton" class="quiet" hidden>新しいメッセージへ</button>
</section>
<form id="composer" class="panel-surface">
<label for="messageText">メッセージ</label>
<div class="compose-row"><textarea id="messageText" rows="2" maxlength="2000" placeholder="メッセージを入力" required disabled></textarea><button id="sendButton" disabled>送信</button></div>
<p id="sendError" class="error" role="alert"></p>
</form>
</main>
<dialog id="budgetSpaceDialog" class="budget-space-dialog" aria-labelledby="budgetSpaceTitle">
    <h2 id="budgetSpaceTitle">共有スペースの設定</h2>
    <p>参加者全員が家計簿・在庫・カテゴリ・リスト・メモを共同利用し、トークを投稿・閲覧できます。招待と参加者の解除は所有者が行います。</p>
    <p>相手が「共有の設定」で参加を承認すると共同利用できます。他の人の変更は同期後に反映されます。</p>
    <form id="budgetSpaceCreate"><label>新しいスペース名<input id="budgetSpaceNewName" maxlength="40" required placeholder="家族のスペース"></label><button type="submit">スペースを作成</button></form>
    <p id="budgetSpaceMessage" role="status" aria-live="polite"></p><button id="budgetSpaceReload" type="button" class="quiet">一覧を更新</button>
    <div id="budgetSpaceList"></div><button id="budgetSpaceClose" type="button" class="quiet">閉じる</button>
</dialog>
</body></html>
